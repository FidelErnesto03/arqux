repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (mirrors CI)
        entry: uv run ruff check --fix src/ tests/
        language: system
        types: [python]
        pass_filenames: false
      - id: surface-homologation
        name: surface homologation (handler count + version)
        entry: python scripts/check_surfaces.py
        language: system
        pass_filenames: false
        always_run: true
