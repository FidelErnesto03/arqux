name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --upgrade pip
          uv pip install -e ".[dev,codec]"

      - name: Lint with ruff
        run: |
          uv run ruff check src/ tests/

      - name: Type-check with mypy (warn-only)
        run: |
          uv run mypy src/arqux/ || true
        continue-on-error: true

      - name: Fetch CODEC-CORTEX conformance columns
        run: |
          # Both conformance columns and the governed corpus come from
          # codec-cortex at two pinned commit shas. Until 2026-10-11 the test
          # suite read them from absolute paths under /home/vatrox/workspace,
          # so 5 tests failed and 8 errored on every runner while
          # docs/release/0.9.0-report.md §3 cited them as reproducible
          # release evidence. The script also verifies the corpus manifest
          # sha256, so a silent upstream change of the governed corpus cannot
          # quietly invalidate the numbers in the report.
          python scripts/fetch_conformance_columns.py \
            --dest "$RUNNER_TEMP/codec-columns" \
            --github-env "$GITHUB_ENV"

      - name: Test with pytest and coverage
        run: |
          uv run pytest --cov=arqux --cov-fail-under=65 -v

      # The four gates below are governance validations, not test results.
      # They must run even when pytest exits non-zero: a failing step skips
      # every later step in the job, so without `if: always()` a known
      # regression in the suite silently disables arqux init, the handler
      # count, the AGENTS.md hash and the P0-B permissions gate. Those four
      # had never executed on any push because a collection error aborted
      # pytest before them (issue 2026-10-11-la-ci-ejecuta-cero-pruebas).
      # All four are verified green locally against the declared pin.

      - name: Validate arqux init
        if: always()
        run: |
          uv run arqux init --path /tmp/test-ws
          test -f /tmp/test-ws/AGENTS.md
          test -d /tmp/test-ws/.arqux/skills/workflows
          test -f /tmp/test-ws/.arqux/meta-brain.cortex
          grep -q "DOM:arqux" /tmp/test-ws/.arqux/meta-brain.cortex

      - name: Validate handlers count
        if: always()
        run: |
          COUNT=$(uv run arqux handlers | wc -l)
          test "$COUNT" -ge 73
          echo "Handlers: $COUNT"

      - name: Validate AGENTS.md hash
        if: always()
        run: |
          TEMPLATE_HASH=$(sha256sum src/arqux/templates/AGENTS.md | cut -d' ' -f1)
          INSTALLED_HASH=$(sha256sum /tmp/test-ws/AGENTS.md | cut -d' ' -f1)
          test "$TEMPLATE_HASH" = "$INSTALLED_HASH"

      - name: Validate permissions (P0-B regression)
        if: always()
        run: |
          uv run python -c "
          import os
          os.environ['ARQUX_STRICT_ROLES'] = '1'
          from arqux.permissions import PermissionContext, PermissionDenied, ROLE_AUDITOR
          ctx = PermissionContext(agent_id='heimdall', role=ROLE_AUDITOR, verified=True)
          for h in ['blueprint.cancel', 'cortex.entry.delete', 'task.fail']:
              try:
                  ctx.check(h)
                  raise SystemExit(f'FAIL: auditor can call {h}')
              except PermissionDenied:
                  pass
          print('P0-B regression: PASS')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          uv venv
          uv pip install ruff
      - name: Ruff check
        run: |
          uv run ruff check src/ tests/
