[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arqux"
version = "0.9.0rc3"
description = "Architectural User Experience for governed AI agents. Identity contracts, MCP governance, Blueprint lifecycle, CORTEX memory, and verifiable evidence."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "arqux Maintainers" }
]
requires-python = ">=3.10"
keywords = ["ai-agents", "governance", "mcp", "agent-orchestration", "cortex", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # MCP runtime — Model Context Protocol server primitives.
    # Pinned <2: server.py uses the lowlevel Server decorators (list_tools/call_tool)
    # removed in mcp 2.x. Port to the new API before unpinning.
    "mcp>=1.0.0,<2",
    # Utilities.
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# CODEC-CORTEX — CORTEX/HCORTEX codec.
# Optional since 0.7.0 (CYCLE-11 decoupling). ArqUX has its own reader/writer/crud/atomic
# modules and degrades gracefully without codec-cortex. Install for full CODEC conformance
# validation and the learning engine:  pip install "arqux[codec]"
#
# Pinned to the 0.6.x line, NOT to the 1.0.0rc1 candidate (2026-10-11, decision
# of the Architect). Reason: the candidate renamed its import namespace to
# `codec_cortex` and flattened the hierarchy, so `cortex.core.validator` and
# `cortex.hcortex.read_renderer` no longer exist. ArqUX needs BOTH:
# `validate` backs `cortex_verify` and `render_hcortex_read` backs HCORTEX
# rendering. Under 1.0.0rc1 only `parse_cortex` survives, so pinning the
# candidate silently disabled the whole CORTEX layer — 89 test failures
# against a 15-failure baseline. See issue
# 2026-10-11-la-dependencia-pineada-codec-cortex-1-0-0rc1-es-.
# 0.6.2 is the newest release that provides the full surface.
codec = [
    "codec-cortex>=0.6.2,<0.7",
]
# ARQUX Voice (BLP-015) — harness-agnostic local voice participation.
# Fully local audio pipeline: faster-whisper STT + Piper/Kokoro TTS +
# Silero VAD (onnxruntime, no torch) + PipeWire capture/playback. Install:
#   pip install "arqux[voice]"
voice = [
    "faster-whisper>=1.0.0",
    "kokoro-onnx>=0.6.1",
    "onnx-asr>=0.12.0",
    "onnxruntime>=1.17.0",
    "piper-tts>=1.2.0",
]
# ARQUX Comms (BLP-017) — Telegram-only comunicación desde ArqUX y sus agentes.
# Extensión MCP stdio aparte (no toca el core). Install:
#   pip install "arqux[comms]"
comms = [
    "httpx>=0.24",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
]

[project.scripts]
arqux = "arqux.cli:main"

[project.urls]
Homepage = "https://github.com/FidelErnesto03/arqux"
Repository = "https://github.com/FidelErnesto03/arqux"
Issues = "https://github.com/FidelErnesto03/arqux/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arqux" = [
    "guides.cortex",
    "templates/*.cortex",
    "templates/*.md",
    "templates/*.cortex.tmpl",
    "templates/*.md.tmpl",
    "identities/*.cortex",
    "identities/*.md",
    "skills/*.skill.md",
    "skills/workflows/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# BLP-005: sin esto pytest importa la copia instalada en site-packages y no
# el código del repositorio, con lo que los tests no ven las correcciones.
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
omit = ["*/plantuml_server.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "E741", "E402", "B904", "N811", "N814", "N818", "F403"]

[tool.mypy]
python_version = "3.10"
# P1-O: relax strict mode (was strict=true, generated 399 errors).
# Re-enable strict gradually per-module.
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "pre-commit>=4.0.0",
]
